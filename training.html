<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Production — Get Sunday Ready Training</title>
<style>
  :root{
    --crimson:#C0392B; --crimson-dark:#a5301f; --crimson-tint:#fbebe9;
    --offwhite:#F7F7F7; --card:#ffffff; --ink:#1a1a1a; --muted:#6b7280;
    --border:#e6e3e1; --green:#1e8e5a; --green-tint:#eaf7f0; --amber:#a86a1a; --amber-tint:#fdf3e6;
    --gold:#c99a2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--offwhite);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:var(--crimson-dark)}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--crimson);outline-offset:2px}

  header{background:#1a1a1a;color:#fff;padding:18px 16px 16px;border-bottom:4px solid var(--crimson)}
  header .wrap{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:21px}
  header h1 span{color:var(--crimson)}
  header .back{color:#c9c9c9;font-size:13px;text-decoration:none;border:1px solid #444;padding:7px 12px;border-radius:8px}
  header .back:hover{border-color:var(--crimson);color:#fff}

  .hud{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}
  .hud .wrap{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hud .rank{font-weight:700;font-size:14px}
  .hud .rank small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
  .hud .bar{flex:1;min-width:140px}
  .track{height:10px;background:#eee;border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--crimson),#e0574a);width:0;transition:width .4s ease}
  .hud .xp{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .hud .badges{display:flex;gap:4px}
  .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#eee;filter:grayscale(1);opacity:.45}
  .medal.on{background:var(--amber-tint);filter:none;opacity:1;box-shadow:inset 0 0 0 2px var(--gold)}

  main{max-width:900px;margin:0 auto;padding:20px 16px 70px}
  h2{margin:0 0 6px;font-size:24px}
  .lead{color:var(--muted);margin:0 0 18px;max-width:65ch}

  .card{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
  .card .head{background:var(--crimson);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .card .head h3{margin:0;font-size:16px}
  .card .head .pill{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .card .body{padding:16px}
  .card.plain .body{padding:16px 18px}

  /* Start screen */
  .start{display:grid;gap:12px}
  .start label{font-weight:600;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text], textarea{font:inherit;font-size:16px;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--offwhite);color:var(--ink);min-width:0}
  input[type=text]{flex:1;min-width:200px}
  textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .btn{text-decoration:none;display:inline-block;border:0;background:var(--crimson);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:9px;cursor:pointer}
  .btn:hover{background:var(--crimson-dark)}
  .btn:disabled{background:#d9d4d2;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--crimson);color:var(--crimson-dark)}
  .btn.small{font-size:13px;padding:8px 12px}

  /* Level map */
  .map{display:grid;gap:12px}
  .lvl{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit}
  .lvl:hover:not(.locked){border-color:var(--crimson);box-shadow:0 2px 10px rgba(192,57,43,.08)}
  .lvl .icon{width:56px;height:56px;border-radius:14px;background:var(--crimson-tint);display:grid;place-items:center;font-size:26px}
  .lvl.done .icon{background:var(--green-tint)}
  .lvl.locked{cursor:not-allowed;opacity:.6}
  .lvl.locked .icon{background:#eee;filter:grayscale(1)}
  .lvl h3{margin:0;font-size:16px}
  .lvl .meta{font-size:12.5px;color:var(--muted)}
  .lvl .mini{height:6px;background:#eee;border-radius:999px;overflow:hidden;margin-top:6px;max-width:240px}
  .lvl .mini div{height:100%;background:var(--green)}
  .status{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .status.todo{background:var(--crimson-tint);color:var(--crimson-dark)}
  .status.done{background:var(--green-tint);color:var(--green)}
  .status.lock{background:#eee;color:var(--muted)}
  .group-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 4px}
  @media (max-width:520px){.lvl{grid-template-columns:44px 1fr}.lvl .icon{width:44px;height:44px;font-size:21px}.lvl .status{grid-column:2;justify-self:start}}

  /* Level view */
  .crumbs{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .step{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-bottom:1px dashed #ececec}
  .step:last-child{border-bottom:0}
  .step input{width:21px;height:21px;flex:0 0 21px;accent-color:var(--green);margin-top:2px;cursor:pointer}
  .step .txt{flex:1;min-width:0}
  .step .txt b{display:block}
  .step .txt small{color:var(--muted);font-size:13px}
  .step.checked .txt b{color:var(--muted)}
  .step a.go{font-size:13px;font-weight:700;white-space:nowrap}
  .read{display:grid;gap:12px}
  .read p{margin:0}
  .read ul{margin:0;padding-left:20px}
  .note{background:var(--amber-tint);border:1px dashed #e8c78f;border-radius:10px;padding:10px 12px;font-size:14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
  .kv dt{font-weight:700;font-variant-numeric:tabular-nums}
  .kv dd{margin:0}
  .confirm{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-weight:600;cursor:pointer}
  .confirm input{width:21px;height:21px;accent-color:var(--green)}

  /* Quiz */
  .q{padding:12px 0;border-bottom:1px solid #f0eded}
  .q:last-of-type{border-bottom:0}
  .q p{margin:0 0 8px;font-weight:600}
  .opts{display:grid;gap:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:9px 11px;cursor:pointer;font-size:14.5px}
  .opt:hover{border-color:#cfc8c6}
  .opt input{margin-top:3px;accent-color:var(--crimson)}
  .opt.right{border-color:var(--green);background:var(--green-tint)}
  .opt.wrong{border-color:var(--crimson);background:var(--crimson-tint)}
  .why{font-size:13px;color:var(--muted);margin-top:6px}
  .result{margin-top:12px;padding:12px;border-radius:10px;font-weight:600}
  .result.pass{background:var(--green-tint);color:var(--green)}
  .result.fail{background:var(--crimson-tint);color:var(--crimson-dark)}

  /* Ordering game */
  .pool,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
  .answer{border:2px dashed var(--border);border-radius:10px;padding:8px;margin:10px 0}
  .answer:empty::before{content:"Tap the steps below in the right order";color:var(--muted);font-size:13px;align-self:center;padding-left:4px}
  .chipbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .chipbtn:hover{border-color:var(--crimson)}
  .answer .chipbtn{background:var(--crimson-tint);border-color:#f0cfc9}
  .answer .chipbtn b{color:var(--crimson-dark);margin-right:4px;font-variant-numeric:tabular-nums}

  /* Level complete toast */
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140%);background:#1a1a1a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .35s ease;z-index:50;max-width:calc(100% - 32px)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* Certificate */
  .cert{border:3px double var(--gold);border-radius:16px;background:#fffdf8;padding:28px 22px;text-align:center}
  .cert .seal{font-size:42px}
  .cert h2{font-size:28px;margin:6px 0}
  .cert .name{font-size:24px;font-weight:800;color:var(--crimson-dark);margin:6px 0}
  .cert ul{list-style:none;padding:0;margin:14px 0;display:grid;gap:4px;font-size:14px}
  .resources{display:grid;gap:8px}
  .resources a{display:block;background:var(--offwhite);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
  .resources a small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
  .resources a:hover{border-color:var(--crimson)}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 40px}
  @media (prefers-reduced-motion:reduce){.fill,.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>TC Production <span>Get Sunday Ready</span></h1>
    <a class="back" href="./">← Sunday Checklists</a>
  </div>
</header>

<div class="hud" id="hud" hidden>
  <div class="wrap">
    <div class="rank" id="hud-rank"></div>
    <div class="bar">
      <div class="track"><div class="fill" id="hud-fill"></div></div>
      <div class="xp" id="hud-xp"></div>
    </div>
    <div class="badges" id="hud-badges"></div>
  </div>
</div>

<main id="app"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>PAPA: Presence · Attitude · Passion · Approachability — Together Church Production Team<br>Your progress saves on this device.</footer>

<script>
// ================== CONTENT ==================
const YT = id => "https://www.youtube.com/watch?v=" + id;
const PL = id => "https://youtube.com/playlist?list=" + id;

const LEVELS = [
  {
    id:"welcome", icon:"🙌", title:"Welcome to the Team", group:"Everyone", minutes:15,
    blurb:"Why we serve, how we serve, and what a Sunday looks like.",
    read:[
      {id:"why", title:"Why we serve", html:`
        <p>We combine our gifts in lighting, audio, visuals, and creativity with the Holy Spirit to create Christ-centered experiences, supporting worship and preaching so people can encounter God's presence.</p>
        <p>We don't serve for show. We serve to make space for His presence. When production goes well, nobody notices us, and that's the goal.</p>
        <p><b>PAPA</b> is how we show up: <b>Presence</b> (be fully present and ready), <b>Attitude</b> (serve with joy), <b>Passion</b> (bring energy and excellence), <b>Approachability</b> (be welcoming and team-oriented).</p>`},
      {id:"rules", title:"Five rules for every role", html:`
        <ul>
          <li>Own your station. Everything with excellence.</li>
          <li>If you don't know something, ask. If you're not sure, ask.</li>
          <li>Wear your headset at all times, including between services.</li>
          <li>Be in your position at least 10 minutes before service starts.</li>
          <li>Follow cues from the Production Director.</li>
        </ul>`},
      {id:"sunday", title:"How a Sunday flows", html:`
        <dl class="kv">
          <dt>Thu 6:30 PM</dt><dd>Rehearsal until 8:30 PM. Prep gear, cues, and content.</dd>
          <dt>7:15 AM</dt><dd>Production Director arrives.</dd>
          <dt>7:30 AM</dt><dd>Everyone else arrives and powers on their station.</dd>
          <dt>7:35 AM</dt><dd>Team huddle: encouragement, prayer, and the win for the day.</dd>
          <dt>7:50 AM</dt><dd>Sound check complete.</dd>
          <dt>8:30 AM</dt><dd>Cue-to-cue run until 8:40.</dd>
          <dt>9:00 AM</dt><dd>Livestream on, before service starts.</dd>
          <dt>Service</dt><dd>The Director calls cues. Everyone follows.</dd>
          <dt>After</dt><dd>Shutdown, debrief, and next week confirmed in Planning Center. Done by 1:30 PM.</dd>
        </dl>
        <p class="note">Scheduling runs through Planning Center (PCO). Accept or decline your dates there, and listen to the week's songs before you arrive.</p>`}
    ],
    watch:[
      {id:"mxu-pod", title:"The MxU Podcast (optional)", url:"https://podcasts.apple.com/us/podcast/id1259075142", note:"Church production leaders on serving well. Pick any episode that sounds interesting.", optional:true}
    ],
    practice:[
      {id:"pco", title:"Log in to Planning Center", note:"Make sure you can see your schedule and accept a date."},
      {id:"songs", title:"Open the Song Bank", note:"Listen to two songs from the worship team's song bank.", url:"https://music.apple.com/us/playlist/tw-song-bank/pl.u-leyl8bPI9Px4Xq"}
    ],
    order:{prompt:"Put the Sunday morning in order.", items:["Power on stations","Team huddle","Sound check complete","Cue-to-cue","Livestream on","Service"]},
    quiz:[
      {q:"When is rehearsal?", o:["Monday 6:30–8:30 PM","Thursday 6:30–8:30 PM","Saturday 9–11 AM","Sunday 7:00 AM"], a:1, why:"Rehearsal is Thursdays, 6:30–8:30 PM."},
      {q:"What time do most stations arrive on Sunday?", o:["7:00 AM","7:15 AM","7:30 AM","8:30 AM"], a:2, why:"Most stations arrive at 7:30. The Production Director arrives at 7:15."},
      {q:"How early should you be in position before service starts?", o:["Right when it starts","At least 2 minutes","At least 10 minutes","At least 30 minutes"], a:2, why:"Be in position at least 10 minutes before start."},
      {q:"Who calls the cues during service?", o:["The worship leader","The Production Director","Whoever notices first","The pastor"], a:1, why:"The Production Director calls all live cues."},
      {q:"When do you wear your headset?", o:["Only during worship","Only when a cue is coming","All the time, including between services","Only if you're running a station"], a:2, why:"Headsets stay on at all times, including between services."},
      {q:"You're not sure how to do something. What do you do?", o:["Figure it out quietly","Skip it","Ask","Wait until after service"], a:2, why:"If you don't know or you're not sure, ask."}
    ]
  },
  {
    id:"stage", icon:"🎒", title:"Stage Manager", group:"Everyone", minutes:20, requires:["welcome"],
    blurb:"Every new volunteer starts here. Learn to be the team's eyes and ears.",
    read:[
      {id:"role", title:"The backbone of the team", html:`
        <p>Stage Managers support the whole on-stage environment so every other role can do their job. You're the off-stage eyes and ears for the team, and you stay close to the stage during service in case anything goes wrong.</p>`},
      {id:"pre", title:"Before service", html:`
        <ul>
          <li>Install batteries in all mics, place mics in stands, and replace IEM batteries.</li>
          <li>Confirm spare batteries and a backup mic are on hand.</li>
          <li>Power on and test headsets/comms on the correct channel.</li>
          <li>Power on the TVs (Stage and Parents Lounge), the LED wall, and both hazers.</li>
          <li>Set up the pastor's table (water and towel) and the outdoor speaker.</li>
          <li>Retrieve the pastor's computer, then clear and clean the stage.</li>
        </ul>`},
      {id:"during", title:"During and between services", html:`
        <ul>
          <li>Communicate all off-stage movement to the team over headset.</li>
          <li>Bring props on and off, including the sermon table.</li>
          <li>Between services: check mic battery levels, replace low ones, and reset the stage and pastor's table.</li>
        </ul>`},
      {id:"post", title:"After service", html:`
        <ul>
          <li>Plug in all rechargeable batteries.</li>
          <li>Power off the hazers, LED wall, and TVs.</li>
          <li>Clear the stage, remove the pulpit, return the pastor's computer, and tear down the outdoor speaker.</li>
          <li>Power off headsets/comms <b>last</b>, once teardown is complete.</li>
        </ul>`}
    ],
    watch:[
      {id:"pp-vol", title:"Volunteer Operator's Guide to ProPresenter 7", url:YT("M7z-I2eU654"), note:"Renewed Vision. Shows what's happening on screen while you're backstage."}
    ],
    practice:[
      {id:"tour", title:"At rehearsal, ask for a 10-minute stage tour", note:"Battery bin, backup mic, comms channels, TV and LED wall power, hazers."}
    ],
    order:{prompt:"Put the post-service shutdown in order.", items:["Plug in rechargeable batteries","Power off hazers, LED wall, and TVs","Clear stage and remove pulpit","Tear down outdoor speaker","Power off headsets/comms"]},
    quiz:[
      {q:"Which role does every new volunteer start in?", o:["ProPresenter Operator","Stage Manager","Audio Engineer","Lighting Tech"], a:1, why:"Everyone starts as Stage Manager."},
      {q:"What goes on the pastor's table?", o:["Water and a towel","Notes and a clicker","A spare mic","Nothing"], a:0, why:"Set up the pastor's table with water and a towel."},
      {q:"What do you do between services?", o:["Take a break off headset","Check mic batteries and replace low ones","Power everything down","Rebuild the playlist"], a:1, why:"Check battery levels, replace low batteries, and reset the stage."},
      {q:"What gets powered off last?", o:["The LED wall","The hazers","Headsets/comms","The TVs"], a:2, why:"Comms go off last, after teardown is complete, so the team can still talk."},
      {q:"A handheld mic dies mid-service. What's your first move?", o:["Walk on stage and fix it","Grab the backup mic and tell the team on headset","Wait until the song ends to say anything","Turn up the other mics"], a:1, why:"That's why the backup mic and spare batteries are staged. Communicate on headset so audio is ready."},
      {q:"How many hazers do we run?", o:["One","Two","Three","None"], a:1, why:"Power on and off both hazers (2)."}
    ]
  },
  {
    id:"audio", icon:"🎚️", title:"Audio Engineer", group:"Pick your station", minutes:40, requires:["stage"],
    blurb:"Run the X32 for clear, consistent, distraction-free sound in the room and on the livestream.",
    read:[
      {id:"gear", title:"What you'll work with", html:`
        <ul>
          <li><b>Behringer X32</b> console</li>
          <li>Stage rack with the system processor</li>
          <li>QSC K.2 mains, QSC KS subs, and a JBL front fill</li>
          <li>IEM/monitor mixes, the livestream mix, and the Parents Lounge feed</li>
        </ul>`},
      {id:"power", title:"Power order (this one matters)", html:`
        <p>Powering gear in the wrong order sends a pop through the system that the speakers amplify. Over time it can damage drivers.</p>
        <dl class="kv"><dt>On</dt><dd>Board (X32, master down) → Rack → Speakers &amp; subs</dd><dt>Off</dt><dd>Mute and master down → Speakers &amp; subs → wait a few seconds → Rack → Save show → Board (Safe Shutdown)</dd></dl>`},
      {id:"mix", title:"Mixing for worship", html:`
        <ul>
          <li>Hold the room between <b>87–95 dB</b>.</li>
          <li>Build everything around the vocals, and dial in the main vocalist for each song.</li>
          <li>Board layout, left to right: vox, acoustic, keys, bass, tracks, drums.</li>
          <li>Mic assignments live in the Planning Center notes. Rename channels to match.</li>
          <li>Unmute the pastor's mic before they speak. Mute speaking mics during transitions.</li>
          <li>Sound check is done by 7:50 AM. Keep an ear on the livestream mix too.</li>
        </ul>`}
    ],
    watch:[
      {id:"x32-strip", title:"Getting to Know the X32: Channel Strip", url:YT("WgFMM7dbqck"), note:"Behringer. Gain, EQ, dynamics, sends, and pan."},
      {id:"x32-start", title:"Getting Started with Your Behringer X32", url:YT("_UeGxfbSV9U"), note:"Sweetwater walkthrough of the console."},
      {id:"x32-qsg", title:"X32 Quick Start Guide (PDF)", url:"https://mediadl.musictribe.com/media/PLM/data/docs/P0ASF/QSG_BE_0603-ACE_X32_WW.pdf", note:"Skim the front panel diagram."},
      {id:"shure", title:"Professional Mixing Tips for Church Sound", url:"https://www.shure.com/en-us/insights/professional-mixing-tips-for-church-sound", note:"Shure article. Short read."},
      {id:"aud-pl", title:"Team Audio Playlist #1", url:PL("PLZNYaC2mTs0h-Y2sWMvVP4GftI-ORt-9T"), note:"Watch the first two videos.", optional:true}
    ],
    practice:[
      {id:"x32edit", title:"Open X32-Edit in offline mode", note:"Free from Behringer for Mac/PC. Find a channel's gain, EQ, and mute, and find the DCAs."},
      {id:"io", title:"Study the Input/Output sheet", note:"Be able to name what's on the first 8 channels.", url:"https://docs.google.com/spreadsheets/d/100vi-vu8F5HFKHPMByXiJlvUlQP25eIuGzKYKKu6iWI/edit?usp=sharing"}
    ],
    order:{prompt:"Power the system ON in the right order.", items:["Bring master fader down","Power on board (X32)","Power on rack","Power on speakers & subs","Load show"]},
    quiz:[
      {q:"Which goes on LAST at power-up?", o:["The X32","The rack","Speakers & subs","It doesn't matter"], a:2, why:"Amps and powered speakers go on last and off first to avoid pops."},
      {q:"What's our target level in the room?", o:["75–80 dB","87–95 dB","100–105 dB","As loud as the band wants"], a:1, why:"Maintain 87–95 dB."},
      {q:"What do you build the mix around?", o:["Drums","Tracks","Vocals","Bass"], a:2, why:"Build everything around vocals."},
      {q:"Where do you find this week's mic assignments?", o:["Planning Center notes","The Song Bank","The Playbook","Ask the drummer"], a:0, why:"Check PCO notes and rename channels to match."},
      {q:"The pastor is about to speak. What do you do?", o:["Wait until they start talking, then unmute","Unmute their mic before they speak","Bring up all mics","Nothing, it's automatic"], a:1, why:"Unmute the pastor's mic before they speak, and mute speaking mics during transitions."},
      {q:"When should sound check be complete?", o:["7:35 AM","7:50 AM","8:30 AM","9:00 AM"], a:1, why:"Sound check is complete by 7:50 AM."},
      {q:"Powering down: what do you do right after the speakers and subs go off?", o:["Turn off the board immediately","Wait a few seconds, then power down the rack","Unplug everything","Turn the speakers back on"], a:1, why:"Amps store energy. Wait a few seconds, then the rack, save the show, and the board last."}
    ]
  },
  {
    id:"pro", icon:"🖥️", title:"ProPresenter Operator", group:"Pick your station", minutes:40, requires:["stage"],
    blurb:"Run lyrics, graphics, videos, and sermon slides from start to finish.",
    read:[
      {id:"gear", title:"What you'll work with", html:`

const RANKS = [
  {xp:0, name:"New Recruit"},
  {xp:120, name:"Crew"},
  {xp:300, name:"Operator"}
];
const XP = {item:10, order:30, quiz:60};
const PASS = 0.8;

// ================== STATE ==================
const KEY = "tc-training-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() || {name:"", started:null, done:{}, quiz:{}, order:{}, finished:{}};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = id => LEVELS.find(l => l.id === id);
const k = (lvl, part, id) => `${lvl}:${part}:${id}`;

function required(lvl){
  const items = [];
  lvl.read.forEach(r => items.push(k(lvl.id,"read",r.id)));
  lvl.watch.filter(w=>!w.optional).forEach(w => items.push(k(lvl.id,"watch",w.id)));
  lvl.practice.forEach(p => items.push(k(lvl.id,"practice",p.id)));
  return items;
}
function levelProgress(lvl){
  const req = required(lvl);
  let total = req.length + (lvl.order?1:0) + (lvl.quiz?1:0);
  let got = req.filter(x=>S.done[x]).length + (lvl.order && S.order[lvl.id] ?1:0) + (S.quiz[lvl.id]?.passed ?1:0);
  return {got,total,pct: total? Math.round(got/total*100):0, done: got===total};
}
function isDone(id){ return levelProgress(L(id)).done; }
function unlocked(lvl){
  if (lvl.requires && !lvl.requires.every(isDone)) return false;
  if (lvl.requiresAny && !lvl.requiresAny.some(isDone)) return false;
  return true;
}
function xp(){
  let x = Object.values(S.done).filter(Boolean).length * XP.item;
  x += Object.values(S.order).filter(Boolean).length * XP.order;
  x += Object.values(S.quiz).filter(q=>q.passed).length * XP.quiz;
  return x;
}
function rank(){
  if (isDone("ready") && ["audio","pro","lights"].every(isDone)) return {name:"Triple Threat"};
  if (isDone("ready")) return {name:"Sunday Ready"};
  const x = xp(); let r = RANKS[0]; RANKS.forEach(R => { if (x >= R.xp) r = R; }); return r;
}
function maxXp(){
  return LEVELS.reduce((s,l)=> s + required(l).length*XP.item + (l.order?XP.order:0) + (l.quiz?XP.quiz:0), 0);
}

// ================== HUD ==================
function renderHud(){
  const hud = $("#hud");
  hud.hidden = !S.started;
  if (!S.started) return;
  const x = xp(), r = rank(), next = isDone("ready") ? null : RANKS.find(R => R.xp > x);
  $("#hud-rank").innerHTML = `${esc(S.name || "Team member")}<small>${esc(r.name)}</small>`;
  $("#hud-fill").style.width = Math.min(100, Math.round(x / maxXp() * 100)) + "%";
  $("#hud-xp").textContent = `${x} XP` + (next ? ` · ${next.xp - x} to ${next.name}` : isDone("ready") ? "" : " · Pass the Ready Check to be Sunday Ready");
  $("#hud-badges").innerHTML = LEVELS.map(l => `<span class="medal ${isDone(l.id)?"on":""}" title="${esc(l.title)}${isDone(l.id)?" complete":""}">${l.icon}</span>`).join("");
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

// Detect newly completed levels to celebrate once
function celebrate(lvlId){
  if (isDone(lvlId) && !S.finished[lvlId]){
    S.finished[lvlId] = new Date().toISOString(); save();
    toast(`${L(lvlId).icon} Level complete: ${L(lvlId).title}! +badge`);
  }
}

// ================== VIEWS ==================
function route(){
  const h = location.hash.replace("#","");
  if (!S.started) return renderStart();
  if (h === "certificate") return renderCert();
  if (h.startsWith("level-")){
    const lvl = L(h.slice(6));
    if (lvl && unlocked(lvl)) return renderLevel(lvl);
  }
  renderMap();
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

function renderStart(){
  renderHud();
  const total = LEVELS.filter(l=>l.group!=="Pick your station").reduce((s,l)=>s+l.minutes,0);
  $("#app").innerHTML = `
    <h2>Get Sunday Ready</h2>
    <p class="lead">A self-paced training for new production team members. Learn how we serve, start as a Stage Manager, then pick a station: Audio, ProPresenter, or Lights. Each level has short reading, videos, practice, a challenge, and a quiz. Pass the Ready Check and you're ready to shadow at rehearsal.</p>
    <div class="card plain"><div class="body start">
      <div class="kv" style="grid-template-columns:auto 1fr">
        <dt>Time</dt><dd>About ${total + 40} minutes for one station, around 2 hours if you do all three. Stop anytime and pick up where you left off.</dd>
        <dt>Pass mark</dt><dd>${Math.round(PASS*100)}% on each quiz. You can retry as many times as you need.</dd>
        <dt>Saving</dt><dd>Progress saves in this browser on this device.</dd>
      </div>
      <label for="name">Your name</label>
      <div class="row">
        <input type="text" id="name" placeholder="First and last name" autocomplete="name" value="${esc(S.name)}">
        <button class="btn" id="go">Start training</button>
      </div>
    </div></div>
    ${restoreBlock()}`;
  const go = () => {
    const n = $("#name").value.trim();
    if (!n){ $("#name").focus(); toast("Add your name so it shows on your certificate."); return; }
    S.name = n; S.started = new Date().toISOString(); save(); location.hash = "#map"; route();
  };
  $("#go").onclick = go;
  $("#name").onkeydown = e => { if (e.key === "Enter") go(); };
  wireRestore();
}

function restoreBlock(){
  return `<details class="card plain"><summary class="body" style="cursor:pointer;font-weight:600">Switching devices? Load your progress code</summary>
    <div class="body" style="padding-top:0">
      <p class="lead" style="margin-bottom:8px">Paste the code you copied from your other device.</p>
      <textarea id="restore" aria-label="Progress code"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn small" id="restore-go">Load progress</button></div>
    </div></details>`;
}
function wireRestore(){
  const b = $("#restore-go"); if (!b) return;
  b.onclick = () => {
    try{
      const data = JSON.parse(decodeURIComponent(escape(atob($("#restore").value.trim()))));
      if (!data || typeof data.done !== "object") throw 0;
      S = Object.assign({name:"",started:null,done:{},quiz:{},order:{},finished:{}}, data);
      save(); toast("Progress loaded."); location.hash = "#map"; route();
    }catch(e){ toast("That code didn't work. Copy the whole code and try again."); }
  };
}

function renderMap(){
  renderHud();
  const groups = ["Everyone","Pick your station","Finish"];
  const allDone = isDone("ready");
  $("#app").innerHTML = `
    <h2>Your training path</h2>
    <p class="lead">Finish each level to earn its badge and unlock the next. You only need one station to reach the Ready Check, but you can do all three.</p>
    ${allDone ? `<div class="card plain"><div class="body row" style="justify-content:space-between;align-items:center"><b>🏆 You're Sunday Ready.</b><a class="btn small" href="#certificate">View certificate</a></div></div>` : ""}
    ${groups.map(g => `
      <div class="group-label">${g}</div>
      <div class="map">
        ${LEVELS.filter(l=>l.group===g).map(l => {
          const p = levelProgress(l), open = unlocked(l);
          const st = !open ? `<span class="status lock">🔒 Locked</span>` : p.done ? `<span class="status done">✓ Complete</span>` : `<span class="status todo">${p.got ? "Continue" : "Start"} · ${l.minutes} min</span>`;
          const lockMsg = l.requiresAny ? "Finish Stage Manager and one station" : l.requires ? `Finish ${l.requires.map(r=>L(r).title).join(", ")}` : "";
          return `<button class="lvl ${!open?"locked":""} ${p.done?"done":""}" data-id="${l.id}" ${!open?`aria-disabled="true"`:""}>
            <span class="icon" aria-hidden="true">${l.icon}</span>
            <span><h3>${esc(l.title)}</h3><span class="meta">${open ? esc(l.blurb) : esc(lockMsg) + " to unlock"}</span>
              ${open ? `<div class="mini"><div style="width:${p.pct}%"></div></div>` : ""}</span>
            ${st}
          </button>`;
        }).join("")}
      </div>`).join("")}
    <div class="group-label">Your progress</div>
    <div class="card plain"><div class="body">
      <p style="margin:0 0 8px">Progress saves in this browser. To continue on another device, copy this code and load it there.</p>
      <div class="row"><button class="btn ghost small" id="copy-code">Copy progress code</button><button class="btn ghost small" id="reset">Start over</button></div>
      <textarea id="code-out" hidden readonly aria-label="Your progress code" style="margin-top:8px"></textarea>
    </div></div>`;
  document.querySelectorAll(".lvl").forEach(b => b.onclick = () => {
    if (b.classList.contains("locked")) { toast("Finish the earlier levels to unlock this one."); return; }
    location.hash = "#level-" + b.dataset.id;
  });
  $("#copy-code").onclick = () => copyText(btoa(unescape(encodeURIComponent(JSON.stringify(S)))), $("#code-out"), "Progress code copied.");
  let armed = false;
  $("#reset").onclick = e => {
    if (!armed){ armed = true; e.target.textContent = "Tap again to erase everything"; setTimeout(()=>{armed=false; if(e.target.isConnected) e.target.textContent="Start over";}, 4000); return; }
    S = {name:"",started:null,done:{},quiz:{},order:{},finished:{}}; save(); location.hash = ""; route();
  };
}

function copyText(text, fallbackEl, msg){
  const done = () => toast(msg);
  const fallback = () => { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.select(); toast("Select and copy the text below."); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function stepRow(id, title, note, url, optional){
  const on = !!S.done[id];
  return `<li class="step ${on?"checked":""}">
    <input type="checkbox" id="cb-${esc(id).replace(/[^\w-]/g,"_")}" data-k="${esc(id)}" ${on?"checked":""} aria-label="${esc(title)}">
    <div class="txt"><b>${esc(title)}${optional?` <small>(optional)</small>`:""}</b>${note?`<small>${esc(note)}</small>`:""}</div>
    ${url?`<a class="go" href="${esc(url)}" target="_blank" rel="noopener">Open ↗</a>`:""}
  </li>`;
}

function renderLevel(lvl){
  renderHud();
  const p = levelProgress(lvl);
  const sec = (title, pill, body) => `<div class="card"><div class="head"><h3>${title}</h3>${pill?`<span class="pill">${pill}</span>`:""}</div><div class="body">${body}</div></div>`;
  const count = (arr, part) => { const req = arr.filter(x=>!x.optional); return `${req.filter(x=>S.done[k(lvl.id,part,x.id)]).length}/${req.length}`; };
  let html = `
    <div class="crumbs"><a href="#map" class="btn ghost small">← All levels</a></div>
    <h2>${lvl.icon} ${esc(lvl.title)}</h2>
    <p class="lead">${esc(lvl.blurb)} About ${lvl.minutes} minutes · ${p.got}/${p.total} done.</p>`;

  html += sec("1 · Learn", count(lvl.read,"read"), lvl.read.map(r => {
    const id = k(lvl.id,"read",r.id);
    return `<div class="read" style="margin-bottom:16px"><h4 style="margin:0">${esc(r.title)}</h4>${r.html}
      <label class="confirm"><input type="checkbox" data-k="${id}" ${S.done[id]?"checked":""}> I've got this</label></div>`;
  }).join(""));

  if (lvl.watch.length) html += sec("2 · Watch", count(lvl.watch,"watch"),
    `<ul class="steps">${lvl.watch.map(w => stepRow(k(lvl.id,"watch",w.id), w.title, w.note, w.url, w.optional)).join("")}</ul>
     <p class="lead" style="margin:10px 0 0;font-size:13px">Check each one off after you watch or read it.</p>`);

  if (lvl.practice.length) html += sec("3 · Practice", count(lvl.practice,"practice"),
    `<ul class="steps">${lvl.practice.map(x => stepRow(k(lvl.id,"practice",x.id), x.title, x.note, x.url)).join("")}</ul>`);

  if (lvl.order) html += sec("4 · Challenge", S.order[lvl.id] ? "✓ Solved" : `+${XP.order} XP`, `<p style="margin:0">${esc(lvl.order.prompt)}</p><div id="order"></div>`);

  html += sec(lvl.order ? "5 · Quiz" : "Scenarios", S.quiz[lvl.id]?.passed ? `✓ Passed · best ${S.quiz[lvl.id].best}%` : `Pass ${Math.round(PASS*100)}%`, `<div id="quiz"></div>`);

  $("#app").innerHTML = html;

  document.querySelectorAll("#app input[data-k]").forEach(cb => cb.onchange = () => {
    S.done[cb.dataset.k] = cb.checked; save();
    const row = cb.closest(".step"); if (row) row.classList.toggle("checked", cb.checked);
    if (cb.checked) toast(`+${XP.item} XP`);
    celebrate(lvl.id); renderHud(); refreshPills(lvl);
  });

  if (lvl.order) renderOrder(lvl);
  renderQuiz(lvl);
}

function refreshPills(lvl){
  // light refresh of the header line without re-rendering inputs
  const p = levelProgress(lvl);
  const lead = document.querySelector("#app .lead");
  if (lead) lead.textContent = `${lvl.blurb} About ${lvl.minutes} minutes · ${p.got}/${p.total} done.`;
  if (p.done) maybeNextBanner(lvl);
}

function maybeNextBanner(lvl){
  if (document.getElementById("next-banner")) return;
  const next = lvl.id === "ready" ? `<a class="btn" href="#certificate">View your certificate</a>` : `<a class="btn" href="#map">Back to your path</a>`;
  $("#app").insertAdjacentHTML("beforeend", `<div class="card plain" id="next-banner"><div class="body row" style="justify-content:space-between;align-items:center"><b>${lvl.icon} Level complete!</b>${next}</div></div>`);
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderOrder(lvl){
  const box = $("#order");
  const correct = lvl.order.items;
  if (S.order[lvl.id]){
    box.innerHTML = `<ol style="margin:10px 0 0;padding-left:20px">${correct.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`;
    return;
  }
  let picked = [], pool = shuffle(correct);
  const draw = (msg) => {
    box.innerHTML = `<div class="answer" aria-label="Your order">${picked.map((x,i)=>`<button class="chipbtn" data-i="${i}" title="Tap to remove"><b>${i+1}</b>${esc(x)}</button>`).join("")}</div>
      <div class="pool">${pool.map((x,i)=>`<button class="chipbtn" data-p="${i}">${esc(x)}</button>`).join("")}</div>
      ${msg||""}`;
    box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { picked.push(pool[b.dataset.p]); pool.splice(b.dataset.p,1); check(); });
    box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { pool.push(picked[b.dataset.i]); picked.splice(b.dataset.i,1); draw(); });
  };
  const check = () => {
    if (pool.length) return draw();
    if (picked.every((x,i)=>x===correct[i])){
      S.order[lvl.id] = true; save(); toast(`Challenge solved! +${XP.order} XP`);
      celebrate(lvl.id); renderHud(); renderOrder(lvl); refreshPills(lvl);
      const pill = box.closest(".card").querySelector(".pill"); if (pill) pill.textContent = "✓ Solved";
    } else {
      const firstWrong = picked.findIndex((x,i)=>x!==correct[i]);
      draw(`<div class="result fail">Not quite. Step ${firstWrong+1} is out of place. Tap a step to send it back and try again.</div>`);
    }
  };
  draw();
}

function renderQuiz(lvl){
  const box = $("#quiz");
  const qs = lvl.quiz.map((q,i)=>({...q, i}));
  box.innerHTML = qs.map(q => `
    <fieldset class="q" style="border:0;margin:0;padding:12px 0" data-q="${q.i}">
      <legend style="padding:0"><p>${q.i+1}. ${esc(q.q)}</p></legend>
      <div class="opts">${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q-${lvl.id}-${q.i}" id="q-${lvl.id}-${q.i}-${j}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</div>
      <div class="why" hidden></div>
    </fieldset>`).join("") + `<div class="row" style="margin-top:10px"><button class="btn" id="submit">Check my answers</button></div><div id="qres"></div>`;
  $("#submit").onclick = () => {
    let right = 0, missing = 0;
    qs.forEach(q => {
      const fs = box.querySelector(`[data-q="${q.i}"]`);
      const sel = fs.querySelector("input:checked");
      fs.querySelectorAll(".opt").forEach(o => o.classList.remove("right","wrong"));
      if (!sel){ missing++; return; }
      const ok = +sel.value === q.a;
      if (ok) right++;
      sel.closest(".opt").classList.add(ok?"right":"wrong");
      const why = fs.querySelector(".why"); why.hidden = false; why.textContent = (ok?"✓ ":"✗ ") + q.why;
    });
    if (missing){ $("#qres").innerHTML = `<div class="result fail">Answer all ${qs.length} questions first. ${missing} left.</div>`; return; }
    const pct = Math.round(right/qs.length*100);
    const prev = S.quiz[lvl.id] || {best:0, passed:false, tries:0};
    const passed = pct >= PASS*100;
    S.quiz[lvl.id] = {best:Math.max(prev.best,pct), passed: prev.passed || passed, tries:(prev.tries||0)+1};
    save();
    if (passed){
      $("#qres").innerHTML = `<div class="result pass">You scored ${pct}% (${right}/${qs.length}). Passed!${prev.passed?"":` +${XP.quiz} XP`}</div>`;
      if (!prev.passed) toast(`Quiz passed! +${XP.quiz} XP`);
      const pill = box.closest(".card").querySelector(".pill"); if (pill) pill.textContent = `✓ Passed · best ${S.quiz[lvl.id].best}%`;
    } else {
      $("#qres").innerHTML = `<div class="result fail">You scored ${pct}% (${right}/${qs.length}). You need ${Math.round(PASS*100)}%. Read the explanations, then change your answers and check again.</div>`;
    }
    celebrate(lvl.id); renderHud(); refreshPills(lvl);
  };
}

    </div></div>
    <div class="card"><div class="head"><h3>Keep learning</h3></div><div class="body resources">
      <a href="https://lightkeyapp.com/help/videos" target="_blank" rel="noopener">Lightkey Tutorial Videos ↗<small>Official lessons on presets, sequences, and control panels.</small></a>
      <a href="https://www.youtube.com/watch?v=M7z-I2eU654" target="_blank" rel="noopener">Volunteer Operator's Guide to ProPresenter 7 ↗<small>Renewed Vision's guide for running a live service.</small></a>
      <a href="https://podcasts.apple.com/us/podcast/id1259075142" target="_blank" rel="noopener">The MxU Podcast ↗<small>Weekly conversations on church production and leading volunteers.</small></a>
      <a href="./" >Sunday Checklists ↗<small>The checklists you'll use every week.</small></a>
    </div></div>`;
  $("#copy-sum").onclick = () => copyText(summary, $("#sum-out"), "Message copied. Paste it in a text to Tony or Juan.");
}
